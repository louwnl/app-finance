<style>
/* Layout: one-column phone app, sticky header, fixed bottom tab bar, bottom sheets for every form. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#dde2ec;
  --ink:#16202e; --ink-2:#556175; --ink-3:#8a94a6;

  --pos:#167a52; --pos-soft:#ddf2e8; --neg:#c23a3a; --neg-soft:#fbe4e4; --warn:#b26a00; --warn-soft:#fdf0d9;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(22,32,46,.06),0 4px 16px rgba(22,32,46,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#18202b; --surface-2:#1e2733; --line:#2b3644;
  --ink:#e8edf5; --ink-2:#a3aec0; --ink-3:#6f7b8e;
  --accent:#7d9bff; --accent-soft:#1f2b4d; --on-accent:#0f141c;
  --pos:#4fc993; --pos-soft:#14301f; --neg:#ff7d7d; --neg-soft:#3a1c1e; --warn:#f0b04f; --warn-soft:#382a12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#18202b; --surface-2:#1e2733; --line:#2b3644;
  --ink:#e8edf5; --ink-2:#a3aec0; --ink-3:#6f7b8e;
  --accent:#7d9bff; --accent-soft:#1f2b4d; --on-accent:#0f141c;
  --pos:#4fc993; --pos-soft:#14301f; --neg:#ff7d7d; --neg-soft:#3a1c1e; --warn:#f0b04f; --warn-soft:#382a12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}

.fab{position:fixed;z-index:7;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(47,85,212,.35)}

.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .2s ease-out}

.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}

.amount-in{font-family:var(--display);font-size:28px!important;font-weight:700}

.prog{display:flex;align-items:center;gap:8px}
.prog .bar{flex:1}

<script>
"use strict";
/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtE=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const eur=n=>fmtE.format(Math.round((n||0)*100)/100);
const eurS=n=>(n>0?"+":"")+eur(n);
const r2=n=>Math.round(n*100)/100;
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
let TODAY=iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const monthDate=(y,m,day)=>{const dt=new Date(y,m,1),yy=dt.getFullYear(),mm=dt.getMonth();return yy+"-"+pad(mm+1)+"-"+pad(Math.min(day,dim(yy,mm)))};
const addMonths=(s,n)=>{const d=parse(s);return monthDate(d.getFullYear(),d.getMonth()+n,d.getDate())};
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MOISL=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fdate=s=>{const d=parse(s);return d.getDate()+" "+MOIS[d.getMonth()]+" "+d.getFullYear()};
const fday=s=>{const d=parse(s);return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})};
const fmonth=k=>{const[y,m]=k.split("-").map(Number);return MOISL[m-1]+" "+y};
const fmonthS=k=>{const[y,m]=k.split("-").map(Number);return MOIS[m-1]+" "+String(y).slice(2)};
const num=v=>{if(v==null)return NaN;const s=String(v).replace(/\s|€/g,"").replace(",",".");return s===""?NaN:Number(s)};
const lastDayOfMonth=k=>{const[y,m]=k.split("-").map(Number);return k+"-"+pad(dim(y,m-1))};

const CATS=[
 {id:"salaire",n:"Salaire",in:1},{id:"aide",n:"Aide familiale",in:1},{id:"apl",n:"APL",in:1},{id:"autre_rev",n:"Autre revenu",in:1},
 {id:"logement",n:"Loyer & charges"},{id:"courses",n:"Courses"},{id:"resto",n:"Restos & sorties"},{id:"transport",n:"Transport"},
 {id:"abos",n:"Abonnements & téléphone"},{id:"sante",n:"Santé"},{id:"shopping",n:"Shopping"},{id:"loisirs",n:"Loisirs"},{id:"frais",n:"Frais bancaires & agios"},
 {id:"pret_etu",n:"Prêt étudiant",cr:1},{id:"renouv",n:"Crédit renouvelable",cr:1},{id:"conso",n:"Crédit conso",cr:1},{id:"paypal",n:"PayPal 4x",cr:1},
 {id:"autre",n:"Autre dépense"},{id:"virement",n:"Virement entre comptes"}];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const LOANCAT={etudiant:"pret_etu",renouvelable:"renouv",conso:"conso"};
const LOANTYPE={etudiant:"Prêt étudiant",renouvelable:"Crédit renouvelable",conso:"Crédit conso"};
const initials=c=>(CAT[c]?.n||"?").replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ---------- état et stockage ---------- */
const emptyState=()=>({accounts:[],loans:[],rules:[],p4x:[],fc:{var:null,acc:null},months:{}});
let S=emptyState(), REAL=null, demo=false, db=null, mode="loading", downloads=null;
const ui={tab:"home",month:TODAY.slice(0,7),accF:"all",year:"all",hz:6,lastDate:null,lastAcc:null};
try{const t=localStorage.getItem("mc-tab");if(t)ui.tab=t}catch(e){}

const LKEY="mes-comptes-v1";
// Dans l'APK Android, Capacitor fournit window.Capacitor et ses plugins natifs.
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}
const queues={};
function enqueue(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(e=>{console.warn(e);setSync(e&&e.code==="quota_exceeded"?"Stockage plein : supprime d'anciennes opérations":"Échec d'enregistrement, réessaie")});return queues[key]}
function cfgBody(){return{accounts:S.accounts,loans:S.loans,rules:S.rules,p4x:S.p4x,fc:S.fc}}
function saveCfg(){if(demo)return;if(mode==="db"){const b=JSON.parse(JSON.stringify(cfgBody()));setSync("Enregistrement…");enqueue("cfg",()=>db.doc("cfg/main").set(b).then(()=>setSync("Enregistré")))}else saveLocal()}
function saveMonth(k){if(demo)return;if(mode==="db"){const items=JSON.parse(JSON.stringify(S.months[k]||[]));setSync("Enregistrement…");enqueue("m"+k,()=>(items.length?db.doc("tx/"+k).set({items}):db.doc("tx/"+k).delete()).then(()=>setSync("Enregistré")))}else saveLocal()}
function setSync(t){$("#sync").textContent=t}

async function boot(){
  mode="local";
  try{const raw=localStorage.getItem(LKEY);if(raw)S=Object.assign(emptyState(),JSON.parse(raw))}catch(e){}
  setSync("Enregistré sur ce téléphone");
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;const t=iso(new Date());if(t!==TODAY){TODAY=t;ui.month=t.slice(0,7);amortCache.clear();render()}});
  if(!NATIVE&&"serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* ---------- échéances générées ---------- */
function ruleDates(r,to){
  const out=[];const end=r.end&&r.end<to?r.end:to;if(!r.start)return out;
  if(r.freq==="w"){for(let d=r.start,i=0;d<=end&&i<2000;d=addDays(d,7),i++)out.push(d)}
  else if(r.freq==="y"){for(let i=0;i<100;i++){const d=addMonths(r.start,12*i);if(d>end)break;out.push(d)}}
  else{const s=parse(r.start),day=+r.day||s.getDate();for(let i=0;i<1200;i++){const d=monthDate(s.getFullYear(),s.getMonth()+i,day);if(d>end)break;if(d>=r.start)out.push(d)}}
  return out;
}
function loanDates(l,to,cap=600){
  const out=[];if(!l.start)return out;const s=parse(l.start),day=+l.day||s.getDate();
  for(let i=0;i<cap;i++){const d=monthDate(s.getFullYear(),s.getMonth()+i,day);if(d>to||(l.end&&d>l.end))break;if(d>=l.start)out.push(d)}
  return out;
}
const amortCache=new Map();
function amort(l){
  const key=JSON.stringify(l);if(amortCache.has(key))return amortCache.get(key);
  const res={rows:[],end:null,never:false,totalInt:0,has:false};
  const ref=num(l.refBal),mon=num(l.monthly),r=(num(l.rate)||0)/1200;
  if(l.refDate&&ref>0&&mon>0){
    res.has=true;let bal=ref;
    if(!l.end&&bal*r>=mon)res.never=true;
    for(const d of loanDates(l,"2100-01-01",720)){
      if(d<=l.refDate)continue;
      if(bal<=0.005)break;
      const it=bal*r;const pay=l.end?Math.min(mon,bal+it):Math.min(mon,bal+it);
      bal=Math.max(0,bal+it-pay);res.totalInt+=it;res.rows.push({d,pay:r2(pay),int:it,bal});
      if(res.never&&res.rows.length>=600)break;
    }
    if(!res.never&&res.rows.length&&res.rows[res.rows.length-1].bal<=0.005)res.end=res.rows[res.rows.length-1].d;
  }
  if(l.end)res.end=loanDates(l,l.end).pop()||l.end;
  amortCache.set(key,res);return res;
}
function loanRemaining(l,at){const a=amort(l);if(!a.has)return null;if(at<l.refDate)return num(l.refBal);let b=num(l.refBal);for(const row of a.rows){if(row.d>at)break;b=row.bal}return b}
function loanPayments(l,to){
  const a=amort(l),mon=num(l.monthly)||0,out=[];
  if(l.end||!a.has){for(const d of loanDates(l,to))out.push({d,amt:mon})}
  else{for(const d of loanDates(l,l.refDate))if(d<=to)out.push({d,amt:mon});for(const row of a.rows){if(row.d>to)break;out.push({d:row.d,amt:row.pay})}}
  return out;
}
function p4xParts(p){const t=num(p.total)||0,q=Math.floor(t/4*100)/100;return[0,1,2,3].map(i=>({d:addDays(p.date,30*i),amt:i===0?r2(t-3*q):q,i}))}
function scheduled(from,to){
  const out=[];
  const push=(src,d,acc,amt,cat,label,ex)=>{if(d<from||d>to)return;const e=ex&&ex[d];if(e&&e.skip)return;out.push({id:src.t+":"+src.id+":"+d,d,acc,amt:e&&e.amt!=null?e.amt:amt,cat,label,auto:src,adj:!!e,plan:amt})};
  for(const r of S.rules)for(const d of ruleDates(r,to))push({t:"rule",id:r.id},d,r.acc,num(r.amount)||0,r.cat,r.label,r.ex);
  for(const l of S.loans)for(const p of loanPayments(l,to))push({t:"loan",id:l.id},p.d,l.acc,-p.amt,LOANCAT[l.kind]||"conso",l.name,l.ex);
  for(const p of S.p4x)for(const x of p4xParts(p))push({t:"p4x",id:p.id},x.d,p.acc,-x.amt,"paypal",p.label+" ("+(x.i+1)+"/4)",p.ex);
  return out;
}
function manualOps(from,to){const out=[];for(const k in S.months){if(k<from.slice(0,7)||k>to.slice(0,7))continue;for(const o of S.months[k])if(o.d>=from&&o.d<=to)out.push(o)}return out}
function legs(o){if(o.cat==="virement"&&o.to)return[{d:o.d,acc:o.acc,amt:-Math.abs(o.amt),tr:1,o},{d:o.d,acc:o.to,amt:Math.abs(o.amt),tr:1,o}];return[{d:o.d,acc:o.acc,amt:o.amt,o}]}
function fcVarMonthly(){
  if(S.fc&&num(S.fc.var)>=0&&S.fc.var!==null&&S.fc.var!=="")return num(S.fc.var);
  const end=addDays(TODAY.slice(0,7)+"-01",-1),start=addMonths(TODAY.slice(0,7)+"-01",-3);
  const sum=manualOps(start,end).filter(o=>o.cat!=="virement"&&o.amt<0).reduce((a,o)=>a-o.amt,0);
  return r2(sum/3);
}
function fcVarOps(from,to){
  const m=fcVarMonthly();if(!(m>0)||!S.accounts.length)return[];
  const acc=(S.fc&&S.fc.acc)||S.accounts[0].id,w=r2(m*12/52),out=[];
  for(let d=addDays(TODAY,1),i=0;d<=to&&i<600;d=addDays(d,7),i++)if(d>=from)out.push({id:"var:"+d,d,acc,amt:-w,cat:"autre",label:"Dépenses courantes (estimation)",est:1});
  return out;
}
function earliest(){
  let e=TODAY;const t=d=>{if(d&&d<e)e=d};
  S.accounts.forEach(a=>t(a.openDate));Object.keys(S.months).forEach(k=>t(k+"-01"));
  S.rules.forEach(r=>t(r.start));S.loans.forEach(l=>t(l.start));S.p4x.forEach(p=>t(p.date));return e;
}
function allOps(from,to,withEst){let o=manualOps(from,to).concat(scheduled(from,to));if(withEst)o=o.concat(fcVarOps(from,to));return o}
/* série de soldes quotidiens. Le solde saisi à la date T est le solde le soir de T. */
function balanceSeries(accIds,from,to,withEst){
  const E=earliest()<from?earliest():from;
  const upper=S.accounts.reduce((m,a)=>a.openDate>m?a.openDate:m,to);const ops=allOps(E,upper,withEst&&upper===to);
  const byDay=new Map();let base=0;
  for(const a of S.accounts){if(!accIds.includes(a.id))continue;base+=num(a.openBal)||0}
  for(const o of ops)for(const l of legs(o)){if(!accIds.includes(l.acc))continue;
    const a=S.accounts.find(x=>x.id===l.acc);if(!a)continue;
    if(l.d<=a.openDate)base-=l.amt; // déjà compris dans le solde saisi
    byDay.set(l.d,(byDay.get(l.d)||0)+l.amt)}
  const pts=[];let cum=base;
  for(let d=E,i=0;d<=to&&i<40000;d=addDays(d,1),i++){cum+=byDay.get(d)||0;if(d>=from)pts.push({d,v:r2(cum)})}
  return pts;
}
function balanceAt(accId,d){const s=balanceSeries([accId],d,d);return s.length?s[0].v:0}

/* ---------- graphique ---------- */
function lineChart(pts,opt={}){
  if(!pts||pts.length<2)return '<p class="muted small">Pas encore assez de données.</p>';
  const W=340,H=170,L=46,R=8,T=10,B=22;
  let step=Math.max(1,Math.ceil(pts.length/240));const P=pts.filter((p,i)=>i%step===0||i===pts.length-1);
  let lo=Math.min(0,...P.map(p=>p.v)),hi=Math.max(0,...P.map(p=>p.v));if(hi===lo)hi=lo+100;
  const span=hi-lo,mag=Math.pow(10,Math.floor(Math.log10(span/4))),cand=[1,2,2.5,5,10].map(m=>m*mag),tick=cand.find(c=>span/c<=5)||cand[4];
  lo=Math.floor(lo/tick)*tick;hi=Math.ceil(hi/tick)*tick;
  const x=i=>L+(W-L-R)*i/(P.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g="";for(let v=lo;v<=hi+1e-9;v+=tick){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="${v===0?1.2:.6}" ${v===0?'stroke-dasharray="3 3"':""}/><text x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${Math.abs(v)>=1000?(v/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" k":v.toLocaleString("fr-FR")}</text>`}
  const line=P.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=line+` L${x(P.length-1).toFixed(1)} ${y(Math.max(lo,0)).toFixed(1)} L${x(0).toFixed(1)} ${y(Math.max(lo,0)).toFixed(1)} Z`;
  const n=3,lab=[];for(let j=0;j<=n;j++){const i=Math.round((P.length-1)*j/n),d=parse(P[i].d);lab.push(`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${j===0?"start":j===n?"end":"middle"}">${pts.length>70?MOIS[d.getMonth()]+" "+String(d.getFullYear()).slice(2):d.getDate()+" "+MOIS[d.getMonth()]}</text>`)}
  const last=P[P.length-1];let mark="";
  if(opt.mark){const i=P.findIndex(p=>p.d>=opt.mark.d);if(i>=0)mark=`<circle cx="${x(i).toFixed(1)}" cy="${y(opt.mark.v).toFixed(1)}" r="4" fill="var(--surface)" stroke="${opt.mark.v<0?"var(--neg)":"var(--warn)"}" stroke-width="2"/>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du solde">${g}<path d="${area}" fill="var(--accent)" fill-opacity=".1"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>${mark}<circle cx="${x(P.length-1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.5" fill="var(--accent)"/>${lab.join("")}</svg>`;
}

    if(a==="edit"){closeSheet();return t==="loan"?sheetLoan(src):t==="p4x"?sheetP4x(src):sheetRule(src)}
    if(a==="skip")src.ex[d]={skip:true};else if(a==="reset")delete src.ex[d];
    else{const m=num(val("oM"));if(isNaN(m)||m<0)return fail("Indique un montant.");src.ex[d]={amt:o.plan<0?-m:m}}
    saveCfg();closeSheet();render();toast("Enregistré");
  });
}

/* ---------- export / import ---------- */
async function doExport(){
  const data=JSON.stringify({app:"mes-comptes",version:1,exported:new Date().toISOString(),...cfgBody(),months:S.months},null,1);
  const name="mes-comptes-"+TODAY+".json",blob=new Blob([data],{type:"application/json"});
  if(NATIVE){const P=window.Capacitor.Plugins;
    try{const w=await P.Filesystem.writeFile({path:name,data,directory:"CACHE",encoding:"utf8"});
      await P.Share.share({title:"Sauvegarde Mes Comptes",files:[w.uri]});markExport()}
    catch(e){if(!/cancel/i.test(String(e&&e.message)))toast("Export impossible pour le moment")}
    return}
  try{const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Sauvegarde Mes Comptes"});markExport();return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);markExport();
}
function markExport(){try{localStorage.setItem("mc-last-export",TODAY)}catch(e){}render()}
function lastExport(){try{return localStorage.getItem("mc-last-export")}catch(e){return null}}
$("#importFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const rd=new FileReader();rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(x){toast("Fichier illisible");return}
  if(!d||!Array.isArray(d.accounts)){toast("Ce fichier ne vient pas de Mes Comptes");return}
  openSheet(`<h2>Importer la sauvegarde ?</h2><p class="muted">${d.accounts.length} compte(s), ${Object.values(d.months||{}).reduce((s,a)=>s+a.length,0)} opération(s). Tout ce qui est enregistré maintenant sera remplacé.</p><form class="f"><div class="btns"><button class="btn danger" type="submit" value="ok">Remplacer mes données</button><button class="btn plain" type="button" data-act="close">Annuler</button></div></form>`,()=>{
    const old=Object.keys(S.months);S=Object.assign(emptyState(),{accounts:d.accounts,loans:d.loans||[],rules:d.rules||[],p4x:d.p4x||[],fc:d.fc||{var:null,acc:null},months:d.months||{}});
    saveCfg();new Set(old.concat(Object.keys(S.months))).forEach(k=>saveMonth(k));closeSheet();render();toast("Sauvegarde importée")})};rd.readAsText(f)});

/* ---------- événements ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="scrim"){closeSheet();return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="tab"){ui.tab=b.dataset.v;try{localStorage.setItem("mc-tab",ui.tab)}catch(x){}render();window.scrollTo(0,0)}
  else if(a==="close")closeSheet();
  else if(a==="add-op"){if(S.accounts.length)sheetOp()}
  else if(a==="edit-op"){const o=findOp(id,b.dataset.m);if(o)sheetOp(o)}
  else if(a==="occ")sheetOcc(id);
  else if(a==="add-acc")sheetAcc();
  else if(a==="edit-acc")sheetAcc(S.accounts.find(x=>x.id===id));
  else if(a==="add-loan")sheetLoan();
  else if(a==="edit-loan")sheetLoan(S.loans.find(x=>x.id===id));
  else if(a==="add-rule")sheetRule();
  else if(a==="edit-rule")sheetRule(S.rules.find(x=>x.id===id));
  else if(a==="add-p4x")sheetP4x();
  else if(a==="edit-p4x")sheetP4x(S.p4x.find(x=>x.id===id));
  else if(a==="mprev"){ui.month=addMonths(ui.month+"-01",-1).slice(0,7);render()}
  else if(a==="mnext"){ui.month=addMonths(ui.month+"-01",1).slice(0,7);render()}
  else if(a==="accf"){ui.accF=b.dataset.v;render()}
  else if(a==="year"){ui.year=b.dataset.v;render()}
  else if(a==="hz"){ui.hz=+b.dataset.v;render()}
  else if(a==="fc-auto"){S.fc=Object.assign({},S.fc,{var:null});saveCfg();render()}
  else if(a==="demo"){REAL=S;S=demoState();demo=true;ui.tab="home";render()}
  else if(a==="quit-demo"){S=REAL||emptyState();REAL=null;demo=false;render()}
  else if(a==="export")doExport();
  else if(a==="import"){if(!demo)$("#importFile").click()}
});
document.addEventListener("submit",e=>{if(e.target.id==="fcForm"){e.preventDefault();const v=num(val("fcVar"));S.fc={var:isNaN(v)?null:v,acc:val("fcAcc")};saveCfg();render();toast("Prévision mise à jour")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#scrim").hidden)closeSheet()});
boot();
</script>
